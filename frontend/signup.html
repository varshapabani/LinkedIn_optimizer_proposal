
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | VAFA Agent</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            padding: 30px 15px;
        }

        .signup-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(11, 31, 58, 0.10);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #123f91, #071a3d);
            border: 1.5px solid #38bdf8;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.2);
        }

        .logo-v {
            color: white;
            font-size: 26px;
            font-weight: 900;
            position: absolute;
            left: 6px;
            top: 7px;
            font-style: italic;
        }

        .logo-f {
            color: #38bdf8;
            font-size: 26px;
            font-weight: 900;
            position: absolute;
            right: 5px;
            bottom: 5px;
            font-style: italic;
        }

        .logo-text {
            font-size: 21px;
            font-weight: bold;
            color: #0b1f3a;
        }

        .heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .heading h1 {
            color: #0b1f3a;
            font-size: 27px;
            margin-bottom: 9px;
        }

        .heading p {
            color: #718096;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #26364b;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dce3ed;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            color: #26364b;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .create-button {
            width: 100%;
            padding: 14px;
            background: #0b1f3a;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
        }

        .create-button:hover {
            background: #2563eb;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #718096;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 28px 22px;
            }

            .heading h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">
            <div class="logo-icon">
                <span class="logo-v">V</span>
                <span class="logo-f">F</span>
            </div>

            <div class="logo-text">VAFA Agent</div>
        </div>

        <div class="heading">
            <h1>Create Your Account</h1>
            <p>Enter your basic information to get started.</p>
        </div>

        <form id="signupForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required>
            </div>

            <div class="form-group">
                <label for="contact">Contact Number</label>
                <input
                    type="tel"
                    id="contact"
                    name="contact"
                    placeholder="Enter your contact number"
                    required>
            </div>

            <div class="form-group">
                <label for="username">Create Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required>
            </div>

            <button type="submit" class="create-button">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="index.html">Login</a>
        </div>

    </div>

    <script src="signup.js"></script>

</body>
</html>
